name: Vision worker rules
on:
  pull_request:
    paths:
      - 'services/vision-worker/**'
      - '.github/workflows/vision-worker.yml'
  push:
    paths:
      - 'services/vision-worker/**'
      - '.github/workflows/vision-worker.yml'
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: services/vision-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install video test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install signed control API test dependencies
        run: python -m pip install --constraint services/vision-worker/transport.requirements.lock.txt aiohttp
      - run: python -m unittest discover -s services/vision-worker/tests -v
      - run: python -m py_compile services/vision-worker/motion_core.py services/vision-worker/calibration.py services/vision-worker/moltivate_motion.py
      - run: bash -n services/vision-worker/bootstrap.sh
